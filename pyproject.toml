[project]
name = "change-order-extract"
version = "0.1.0"
description = "Extract structured construction change orders from messy PDFs and text, with per-field confidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pypdf>=4.2",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "uvicorn>=0.27",
]

[project.scripts]
change-order = "change_order_extract.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
change_order_extract = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
